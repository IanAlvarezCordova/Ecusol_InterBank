server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Esto redirige todas las rutas al index.html para que React las maneje
        try_files $uri $uri/ /index.html;
    }

    # Proxy para el Backend (Apunta al API Gateway)
    # El Frontend no debe hablar directo con microservicios ni BFF, todo por Gateway
    # Proxy para el Backend (Apunta al API Gateway)
    # Usamos resolver 127.0.0.11 (Docker DNS) valida por 30s
    # y una variable para evitar que Nginx crashee al inicio si el host no esta listo.
    location /api {
        resolver 127.0.0.11 valid=30s;
        set $upstream_gateway http://ecusol-gateway:8080;
        proxy_pass $upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Opcional: Manejo de errores de red
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}