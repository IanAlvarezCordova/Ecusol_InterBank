services:
  # --- INFRAESTRUCTURA ---
  postgres-db-ecusol:
    image: postgres:15-alpine
    container_name: postgres-db-ecusol
    environment:
      - POSTGRES_PASSWORD=admin
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data_ecusol:/var/lib/postgresql/data
    ports: [ "5434:5432" ]
    networks: [ ecusol-net ]

  mongo-db-ecusol:
    image: mongo:latest
    container_name: mongo-db-ecusol
    ports: [ "27019:27017" ]
    networks: [ ecusol-net ]

  rabbitmq-server:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [ ecusol-net ]
  # --- GATEWAY (Puerto 9180) ---
  ecusol-gateway:
    build: ./gateway-server
    container_name: ecusol-gateway
    ports: [ "9180:8080" ]
    depends_on:
      - ecusol-ms-transacciones
      - ecusol-ms-cuentas
      - ecusol-ms-clientes
      - ecusol-ms-geografia
      - web-backend-ecusol
      - ventanilla-backend-ecusol
    environment:
      - EUREKA_CLIENT_ENABLED=false
      # NOTA: Las rutas se cargan desde src/main/resources/application.yml
      # No inyectamos SPRING_CLOUD_GATEWAY_ROUTES por ENV para evitar conflictos.
    networks: [ ecusol-net ]

  # --- CORE BANCARIO ---
  ecusol-ms-cuentas:
    build: ./cbs
    container_name: ecusol-ms-cuentas
    environment:
      - DB_HOST=postgres-db-ecusol
      - DB_PASSWORD=admin
      - EUREKA_CLIENT_ENABLED=false
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-ecusol:5432/postgres?currentSchema=ecusol_cuentas
    networks: [ ecusol-net ]

  ecusol-ms-clientes:
    build: ./ms-clientes
    container_name: ecusol-ms-clientes
    environment:
      - DB_HOST=postgres-db-ecusol
      - EUREKA_CLIENT_ENABLED=false
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-ecusol:5432/postgres?currentSchema=ecusol_clientes
    networks: [ ecusol-net ]

  ecusol-ms-geografia:
    build: ./ms-geografiaMongo
    container_name: ecusol-ms-geografia
    environment:
      - MONGO_URI=mongodb://mongo-db-ecusol:27017/db_geo_ecusol
      - EUREKA_CLIENT_ENABLED=false
    networks: [ ecusol-net ]
  ecusol-ms-transacciones:
    build: ./ms-transacciones
    container_name: ecusol-ms-transacciones
    depends_on:
      rabbitmq-server:
        condition: service_healthy
      postgres-db-ecusol:
        condition: service_started
    environment:
      - DB_HOST=postgres-db-ecusol
      - DB_PASSWORD=admin
      - URL_MS_CUENTAS=http://ecusol-ms-cuentas:8083
      - URL_MS_GEOGRAFIA=http://ecusol-ms-geografia:8081
      - URL_MS_CLIENTES=http://ecusol-ms-clientes:8084
      - EUREKA_CLIENT_ENABLED=false
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-ecusol:5432/postgres?currentSchema=ecusol_transacciones
      - APP_SWITCH_URL=http://34.16.106.7:8000
      - APP_SWITCH_NETWORK_URL=http://34.16.106.7:8000
      - APP_SWITCH_APIKEY=PUBLIC_KEY_ECUSOL_67890
      - BANCO_CODIGO=ECUSOL_BK
      - SPRING_RABBITMQ_HOST=rabbitmq-server
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - BANCO_COLA_ENTRADA=queue-banco-ecusol
      - WEBHOOK_URL=http://ecusol-ms-transacciones:8082/api/transacciones/callback
    ports: [ "8182:8082" ]
    networks: [ ecusol-net ]

  # --- SERVICIO WEB ---
  web-backend-ecusol:
    build: ./Web/BackEnd_Ecusol
    container_name: web-backend-ecusol
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-ecusol:5432/postgres?currentSchema=ecusol_web
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - ECUSOL_CORE_URL=http://ecusol-gateway:8080/api
    networks: [ ecusol-net ]

  # --- MODIFICACIÓN: FRONTEND WEB ---
  front-web-ecusol:
    build: ./Web/Frontend_Ecusol
    container_name: front-web-ecusol
    ports: [ "8090:80" ]
    depends_on:
      - ecusol-gateway
    networks: [ ecusol-net ]

  # --- SERVICIO VENTANILLA ---
  ventanilla-backend-ecusol:
    build: ./Ventanilla/BackEnd_VENTANILLA
    container_name: ventanilla-backend-ecusol
    ports: [ "8185:8083" ]
    depends_on:
      - postgres-db-ecusol
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-ecusol:5432/postgres?currentSchema=ecusol_ventanilla
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - ECUSOL_CORE_URL=http://ecusol-gateway:8080/api/core
    networks: [ ecusol-net ]

  # --- MODIFICACIÓN: FRONTEND VENTANILLA ---
  # Cambiamos puerto externo para evitar conflictos, pero el interno sigue siendo 80
  front-ventanilla-ecusol:
    build: ./Ventanilla/FrontEnd_Ecusol
    container_name: front-ventanilla-ecusol
    ports: [ "8081:80" ]
    networks: [ ecusol-net ]
    # --- AGREGADO: NGINX PROXY MANAGER (El Portero de EcuSol) ---
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: ecusol-npm
    restart: always
    ports:
      - '80:80' # HTTP (Internet)
      - '443:443' # HTTPS (Seguro)
      - '81:81' # Panel Admin
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - front-web-ecusol
      - front-ventanilla-ecusol
    networks:
      - ecusol-net

networks:
  ecusol-net:
    driver: bridge

volumes:
  postgres_data_ecusol:
