server.port=8082
spring.application.name=ms-transacciones

# --- BASE DE DATOS (CLOUD READY) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres-db-ecusol}:5432/db_ecusol_transacciones
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# --- SWAGGER ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- CONEXIÓN ENTRE MICROSERVICIOS ---
# URLs dinámicas: En local usa http://nombre-contenedor:puerto
# En AWS usarás http://load-balancer-url
api.cuentas.url=${URL_MS_CUENTAS:http://ecusol-ms-cuentas:8083}
api.geo.url=${URL_MS_GEOGRAFIA:http://ecusol-ms-geografia:8081}
# (Opcional si vas a validar clientes en el futuro)
api.clientes.url=${URL_MS_CLIENTES:http://ecusol-ms-clientes:8084}

api.switch.url=${APP_SWITCH_URL:http://34.16.106.7:8000}
app.switch.url=${APP_SWITCH_URL:http://34.16.106.7:8000/api/v2/switch/transfers}
api.switch.apikey=${APP_SWITCH_APIKEY:PUBLIC_KEY_ECUSOL_67890}
app.switch.apikey=${APP_SWITCH_APIKEY:PUBLIC_KEY_ECUSOL_67890}
banco.codigo=${BANCO_CODIGO:ECUSOLBK}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq-server}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=/
spring.rabbitmq.connection-timeout=10s
spring.rabbitmq.requested-heartbeat=60

spring.rabbitmq.listener.simple.acknowledge-mode=MANUAL
spring.rabbitmq.listener.simple.max-concurrency=5
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=1.0

banco.cola.entrada=${BANCO_COLA_ENTRADA:queue-banco-ecusol}
banco.webhook.url=${WEBHOOK_URL:http://ecusol-ms-transacciones:8082/api/transacciones/callback}